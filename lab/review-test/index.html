<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review test · Climb lab</title>
<style>
  :root {
    color-scheme: dark;
    --page: #0c0c0d; --surface: #131313; --raised: #1a1a19;
    --ink: #f1eee6; --ink-2: #b8b3a7; --muted: #857f73;
    --border: rgba(255, 244, 220, .08); --border-2: rgba(255, 244, 220, .15);
    --brass: #b8955a; --brass-hi: #e2c48a; --wash: rgba(201, 164, 101, .12);
    --good: #2fb26a; --good-text: #4fcf87; --bad: #e0565b; --bad-text: #f07a7e; --warn: #d79b2c;
    --ally: #5aa9e6; --enemy: #e8a33c;
    --display: Bahnschrift, "DIN Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border-2); padding-bottom: 10px; margin-bottom: 14px; }
  header h1 { font: 600 22px var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 0; color: var(--brass-hi); }
  header .meta { color: var(--ink-2); }
  .lab { margin-left: auto; font-size: 12px; color: var(--muted); border: 1px solid var(--border-2); padding: 2px 8px; border-radius: 99px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .stage { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; }
  canvas#map { display: block; width: 100%; aspect-ratio: 1; }
  .clock { position: absolute; top: 10px; left: 12px; font: 600 26px var(--display); letter-spacing: .05em; text-shadow: 0 1px 4px #000; }
  .speed { position: absolute; top: 14px; right: 12px; font-size: 12px; color: var(--ink-2); background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 99px; }
  .banner { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(12,12,13,.85); border: 1px solid var(--brass); color: var(--brass-hi); padding: 6px 14px; border-radius: 99px; font: 600 14px var(--display); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; display: none; }
  .bar { margin-top: 10px; }
  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  button { font: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--border-2); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--brass); }
  button.primary { background: var(--brass); color: #141210; border-color: var(--brass); font-weight: 600; }
  .tl { position: relative; height: 46px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; overflow: hidden; touch-action: none; }
  .tl canvas { width: 100%; height: 100%; display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 14px; }
  .card + .card { margin-top: 12px; }
  .t-label { font: 600 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .card h2 { font: 600 20px var(--display); letter-spacing: .03em; margin: 4px 0 8px; }
  .facts { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 6px; }
  .facts li { display: flex; gap: 8px; align-items: baseline; }
  .facts b { font: 600 18px var(--display); min-width: 64px; color: var(--brass-hi); }
  .opts { display: grid; gap: 8px; }
  .opts button { text-align: left; padding: 10px 12px; }
  .opts button.picked { border-color: var(--brass-hi); background: var(--wash); }
  .opts button[disabled] { cursor: default; }
  .verdict { display: inline-block; font: 600 12px var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 1px 8px; border-radius: 99px; margin-left: 6px; }
  .v-good { background: rgba(47,178,106,.18); color: var(--good-text); }
  .v-risky { background: rgba(224,86,91,.16); color: var(--bad-text); }
  .why { color: var(--ink-2); font-size: 13px; margin: 3px 0 0; }
  .you { font-size: 12px; color: var(--muted); margin-left: 6px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .muted { color: var(--muted); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Review</h1>
    <span class="meta" id="meta"></span>
    <span class="lab">Lab test · not part of Climb yet</span>
  </header>
  <div class="grid">
    <div>
      <div class="stage">
        <canvas id="map" width="900" height="900"></canvas>
        <div class="clock" id="clock">0:00</div>
        <div class="speed" id="speed"></div>
        <div class="banner" id="banner"></div>
      </div>
      <div class="bar">
        <div class="controls">
          <button id="play" class="primary" type="button">▶ Play review</button>
          <button id="jump" type="button">Jump to key moment</button>
          <span class="muted" id="hint">Fast through quiet stretches, slows near your fights, stops for questions.</span>
        </div>
        <div class="tl" id="tl"><canvas id="tlc" width="1000" height="46"></canvas></div>
        <div class="legend">
          <span><i style="background:var(--ally)"></i>Your team</span>
          <span><i style="background:var(--enemy)"></i>Enemy team</span>
          <span><i style="background:var(--brass-hi)"></i>Your kill</span>
          <span><i style="background:var(--bad)"></i>Your death</span>
          <span><i style="background:#fff;border-radius:0;transform:rotate(45deg)"></i>Question</span>
          <span>Band: souls lead (up = you ahead)</span>
        </div>
      </div>
    </div>
    <aside id="side">
      <div class="card" id="intro">
        <div class="t-label">This game</div>
        <h2>Loading…</h2>
      </div>
    </aside>
  </div>
</div>
<script src="moments.js"></script>
<script>
// ?m=<match id> picks a packed match from matches/; defaults to the first test match
const MATCH_ID = (new URLSearchParams(location.search).get('m') || '135194126').replace(/\D/g, '');
const s = document.createElement('script'); s.src = `matches/${MATCH_ID}.js`; s.onload = () => review();
s.onerror = () => { document.getElementById('meta').textContent = `No packed data for match ${MATCH_ID} (run tools/fetch.py).`; };
document.head.appendChild(s);

function review() {
  const M = window.MATCH, N = M.heroes.length, RAD = 10752;
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const C = { ally: css('--ally'), enemy: css('--enemy'), brass: css('--brass-hi'), bad: css('--bad'), muted: css('--muted') };
  const mine = M.kills.filter(k => k.a === M.me || k.v === M.me);
  const deaths = mine.filter(k => k.v === M.me).length, kills = mine.filter(k => k.a === M.me && k.v !== M.me).length;
  $('meta').textContent = `${M.heroes[M.me].name} · ${M.won ? 'Win' : 'Loss'} · ${kills} kills · ${deaths} deaths · ${fmt(M.end)}`;

  // ---- the questions this match earned (moments.js)
  const QS = Moments.findMoments(M).map(m => ({ ...m, q: Moments.buildQuestion(M, m), clipEnd: Math.min(M.end, m.death + 1) }));
  const PH = { lane: 'Lane', mid: 'Mid-game', late: 'Late game' };
  const count = p => QS.filter(q => q.phase === p).length;
  $('intro').innerHTML = `<div class="t-label">This game</div>
    <h2>${QS.length ? `${QS.length} question${QS.length === 1 ? '' : 's'}` : 'Nothing to ask'}</h2>
    <p class="muted" style="margin:0">${['lane', 'mid', 'late'].map(p => `${PH[p]} ${count(p)}`).join(' · ')}</p>
    <p class="note">Climb only asks when a fight was clearly bad before it started: you were outnumbered, and the enemies in it had at least 1.75× the souls of your side.</p>`;
  $('jump').style.display = QS.length ? '' : 'none';

  // ---- map
  const cv = $('map'), g = cv.getContext('2d'), W = cv.width;
  const bg = new Image(); bg.src = 'https://assets-bucket.deadlock-api.com/assets-api-res/images/maps/minimap_midtown_mid.png';
  const icons = M.heroes.map(h => { const i = new Image(); i.src = h.img; return i; });
  const base = (x, y) => [(x + RAD) / (2 * RAD) * W, (RAD - y) / (2 * RAD) * W];
  const cam = { x: W / 2, y: W / 2, s: 1 }; // camera in base-map pixels; zooms onto the fight during a question
  const px = (x, y) => { const [bx, by] = base(x, y); return [(bx - cam.x) * cam.s + W / 2, (by - cam.y) * cam.s + W / 2]; };
  let focus = null; // hero indexes to highlight during a question
  function aim(t) {
    let tx = W / 2, ty = W / 2, ts = 1;
    if (focus) {
      const pts = focus.map(i => at(t, i)).filter(p => p.alive && (p.x || p.y)).map(p => base(p.x, p.y));
      if (pts.length) {
        const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
        tx = (Math.min(...xs) + Math.max(...xs)) / 2; ty = (Math.min(...ys) + Math.max(...ys)) / 2;
        const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys), 60);
        ts = Math.max(1, Math.min(3.2, W * .55 / span));
      }
    }
    const k = .08; cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; cam.s += (ts - cam.s) * k;
  }
  const at = (t, i) => {
    const a = M.frames[Math.max(0, Math.min(M.end, Math.floor(t)))], b = M.frames[Math.max(0, Math.min(M.end, Math.floor(t) + 1))], f = t - Math.floor(t);
    const o = i * 4, jump = Math.hypot(b[o] - a[o], b[o + 1] - a[o + 1]) > 3000; // respawns teleport: no sliding
    return { x: jump ? a[o] : a[o] + (b[o] - a[o]) * f, y: jump ? a[o + 1] : a[o + 1] + (b[o + 1] - a[o + 1]) * f, hp: a[o + 2], alive: a[o + 3] };
  };
  // objective icons from deadlock-api's copy of the game's minimap art, tinted per team on a small offscreen canvas
  const MM = 'https://assets-bucket.deadlock-api.com/assets-api-res/icons/minimap/';
  const OBJ_SRC = { guardian: 'objective_icon_t1.svg', basegd: 'objective_icon_t1.svg', walker: 'objective_icon_t2.svg', patron: 'objective_icon_t2.svg', midboss: 'boss_marker_neutral_psd.png' };
  const OBJ_SIZE = { guardian: 18, basegd: 13, walker: 24, patron: 32, midboss: 26 };
  const objImg = {}, tintCache = {};
  for (const [k, f] of Object.entries(OBJ_SRC)) { const i = new Image(); i.src = MM + f; objImg[k] = i; }
  function tinted(kind, col) {
    const key = kind + col, src = objImg[kind];
    if (tintCache[key]) return tintCache[key];
    if (!src.complete || !src.naturalWidth) return null;
    const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
    x.drawImage(src, 0, 0, 64, 64);
    if (kind !== 'midboss') { x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, 64, 64); }
    return (tintCache[key] = c);
  }
  function draw(t) {
    aim(t);
    g.clearRect(0, 0, W, W);
    if (bg.complete && bg.naturalWidth) { const [x0, y0] = px(-RAD, RAD), [x1, y1] = px(RAD, -RAD); g.filter = 'brightness(1.9) contrast(1.15)'; g.drawImage(bg, x0, y0, x1 - x0, y1 - y0); g.filter = 'none'; }
    // objectives: the game's own minimap icons, team-coloured; destroyed ones stay as faint grey
    for (const o of M.objs) {
      if (t < o.born) continue;
      const gone = o.died != null && o.died <= t;
      if (gone && o.kind === 'midboss') continue;
      const [x, y] = px(o.x, o.y), s = OBJ_SIZE[o.kind] * Math.sqrt(cam.s);
      const col = gone ? '#5b5750' : o.team === 4 ? '#c9a3ff' : o.team === M.myTeam ? C.ally : C.enemy;
      const img = tinted(o.kind, col);
      g.globalAlpha = gone ? .45 : focus ? .55 : .95;
      if (img) g.drawImage(img, x - s / 2, y - s / 2, s, s);
      g.globalAlpha = 1;
    }
    // troopers (waves)
    const tr = M.troop[String(Math.floor(t / 2) * 2)] || [];
    for (let i = 0; i < tr.length; i += 3) {
      const [x, y] = px(tr[i] * 10, tr[i + 1] * 10);
      g.fillStyle = tr[i + 2] === M.myTeam ? C.ally : C.enemy; g.globalAlpha = focus ? .25 : .55;
      g.beginPath(); g.arc(x, y, 2.2 * Math.sqrt(cam.s), 0, 7); g.fill();
    }
    g.globalAlpha = 1;
    // heroes: unfocused first, then focused on top
    const order = [...Array(N).keys()].sort((a, b) => (focus ? focus.includes(a) - focus.includes(b) : 0) || (a === M.me) - (b === M.me));
    for (const i of order) {
      const p = at(t, i); if (!p.alive || (!p.x && !p.y)) continue;
      const [x, y] = px(p.x, p.y), lit = !focus || focus.includes(i), r = i === M.me ? 17 : 14;
      const col = M.heroes[i].team === M.myTeam ? C.ally : C.enemy;
      g.globalAlpha = lit ? 1 : .32;
      g.beginPath(); g.arc(x, y, r + 3, 0, 7); g.fillStyle = col; g.fill();
      g.save(); g.beginPath(); g.arc(x, y, r, 0, 7); g.clip(); g.fillStyle = '#111'; g.fillRect(x - r, y - r, 2 * r, 2 * r);
      if (icons[i].complete && icons[i].naturalWidth) g.drawImage(icons[i], x - r, y - r, 2 * r, 2 * r);
      g.restore();
      if (i === M.me) { g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, r + 6, 0, 7); g.stroke(); }
      if (lit) { // health bar
        g.fillStyle = 'rgba(0,0,0,.7)'; g.fillRect(x - r, y + r + 6, 2 * r, 4);
        g.fillStyle = p.hp > 50 ? '#8fd18f' : p.hp > 25 ? css('--warn') : C.bad; g.fillRect(x - r, y + r + 6, 2 * r * Math.min(1, p.hp / 100), 4);
      }
      g.globalAlpha = 1;
    }
    $('clock').textContent = fmt(t);
  }

  // ---- timeline: souls lead band + markers
  const tc = $('tlc'), tg = tc.getContext('2d'), TW = tc.width, TH = tc.height;
  const lead = M.souls.map(row => row.reduce((a, v, i) => a + (M.heroes[i].team === M.myTeam ? v : -v), 0));
  const maxGap = Math.max(...lead.map(Math.abs), 1);
  function drawTl(t) {
    tg.clearRect(0, 0, TW, TH);
    const mid = TH / 2;
    tg.beginPath(); tg.moveTo(0, mid);
    lead.forEach((d, i) => tg.lineTo(i * 10 / M.end * TW, mid - d / maxGap * (mid - 6)));
    tg.lineTo(TW, mid); tg.closePath(); tg.fillStyle = 'rgba(184,149,90,.25)'; tg.fill();
    tg.strokeStyle = 'rgba(255,244,220,.15)'; tg.beginPath(); tg.moveTo(0, mid); tg.lineTo(TW, mid); tg.stroke();
    for (const k of mine) {
      const x = k.t / M.end * TW; tg.fillStyle = k.v === M.me ? C.bad : C.brass;
      tg.beginPath(); tg.arc(x, k.v === M.me ? TH - 7 : 7, 4, 0, 7); tg.fill();
    }
    for (const q of QS) { tg.save(); tg.translate(q.t / M.end * TW, mid); tg.rotate(Math.PI / 4); tg.fillStyle = q.done ? '#8a857a' : '#fff'; tg.fillRect(-5, -5, 10, 10); tg.restore(); }
    tg.fillStyle = '#fff'; tg.fillRect(t / M.end * TW - 1, 0, 2, TH);
  }

  // ---- playback: fast when quiet, slow near your fights, stop for each question
  let t = 0, playing = false, clip = null, lastTs = 0, cur = null;
  const next = () => QS.find(q => !q.done && q.t >= t - .01);
  const busy = s => mine.some(k => s > k.t - 15 && s < k.t + 4);
  const speedAt = s => { if (clip) return 1.5; const n = next(); return (n && s > n.t - 20) || busy(s) ? 3 : 24; };
  function frame(ts) {
    const dt = Math.min(.1, (ts - (lastTs || ts)) / 1000); lastTs = ts;
    if (playing) {
      const sp = speedAt(t), n = next(); t += dt * sp; $('speed').textContent = `${sp}×`;
      if (!clip && n && t >= n.t) { t = n.t; ask(n); }
      if (clip && t >= clip.end) { t = clip.end; playing = false; clip.done(); clip = null; }
      if (t >= M.end) { t = M.end; playing = false; }
      setPlay();
    }
    draw(t); drawTl(t);
    requestAnimationFrame(frame);
  }
  const setPlay = () => { $('play').textContent = playing ? '❚❚ Pause' : (t >= M.end ? '↺ Replay' : '▶ Play review'); };
  const resume = () => { focus = null; playing = true; lastTs = 0; setPlay(); };
  $('play').onclick = () => { if (clip || cur) return; if (t >= M.end) { t = 0; QS.forEach(q => q.done = false); } playing = !playing; lastTs = 0; setPlay(); };
  $('jump').onclick = () => { if (clip || cur) return; const n = QS.find(q => !q.done) || QS[0]; if (!n) return; n.done = false; t = n.t - 12; resume(); };
  const seek = e => { if (clip || cur) return; const r = $('tl').getBoundingClientRect(); t = Math.max(0, Math.min(M.end, (e.clientX - r.left) / r.width * M.end)); QS.forEach(q => { if (q.t >= t) q.done = false; }); };
  $('tl').addEventListener('pointerdown', e => { seek(e); $('tl').setPointerCapture(e.pointerId); $('tl').onpointermove = seek; });
  $('tl').addEventListener('pointerup', () => { $('tl').onpointermove = null; });

  // ---- a question: stop, ask, play the clip, then explain
  function ask(q) {
    cur = q; playing = false; focus = q.focus; setPlay();
    const i = QS.indexOf(q) + 1;
    $('banner').textContent = `Question ${i} · what do you do?`; $('banner').style.display = 'block';
    $('side').innerHTML = `<div class="card" id="qcard">
      <div class="t-label">${PH[q.phase]} · ${fmt(q.t)} · Question ${i} of ${QS.length}</div>
      <h2>${esc(q.q.title)}</h2>
      <ul class="facts">${q.q.facts.map(([n, s]) => `<li><b>${esc(n)}</b><span>${esc(s)}</span></li>`).join('')}</ul>
      <div class="opts">${q.q.opts.map(o => `<button type="button" data-o="${o.id}">${esc(o.label)}</button>`).join('')}</div>
      <p class="note">Test: this doesn’t yet check which enemies you could actually see at the time.</p></div>`;
    document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => answer(q, b.dataset.o));
  }
  function answer(q, id) {
    const pick = q.q.opts.find(o => o.id === id);
    document.querySelectorAll('[data-o]').forEach(b => { b.disabled = true; b.classList.toggle('picked', b.dataset.o === id); });
    $('banner').textContent = pick.verdict === 'good' ? 'Good call · here’s what happened' : 'Watch what happened';
    clip = { end: q.clipEnd, done: () => reveal(q, id) }; // the clip first, then the explanation
    playing = true; lastTs = 0;
  }
  function reveal(q, id) {
    $('banner').style.display = 'none';
    const rows = q.q.opts.map(o => `<li style="display:block"><span>${esc(o.label)}</span><span class="verdict v-${o.verdict}">${o.verdict === 'good' ? 'Good call' : 'Risky'}</span>${o.id === q.q.did ? '<span class="you">what you did</span>' : ''}${o.id === id && o.id !== q.q.did ? '<span class="you">your answer</span>' : ''}<p class="why">${esc(o.why)}</p></li>`).join('');
    $('side').insertAdjacentHTML('beforeend', `<div class="card">
      <div class="t-label">What happened</div>
      <h2>${esc(q.q.outcome)}</h2>
      <ul class="facts" style="gap:12px">${rows}</ul>
      <p class="note">Why this was a question: you were outnumbered, and their side of the fight had ${(q.fight.them / Math.max(1, q.fight.us)).toFixed(1)}× your souls, before it began. The full version will also compare it with what winning players did in similar spots.</p>
      <button type="button" id="cont" class="primary" style="margin-top:6px">${QS.some(x => !x.done && x !== q) ? 'Continue review' : 'Finish review'}</button></div>`);
    $('cont').onclick = () => { q.done = true; cur = null; resume(); $('cont').remove(); };
  }

  setPlay(); requestAnimationFrame(frame);
}
</script>
</body>
</html>
