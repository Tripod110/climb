<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- The only network surface is deadlock-api.com (data + rank badges), its asset bucket
     (hero icons), Steam's avatar CDN, Gemini (only when you add your own key for the coach), and
     the Climb helper on this PC (127.0.0.1:47615, play time). Anything else is refused by the browser, not just by convention. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob: https://api.deadlock-api.com https://assets-bucket.deadlock-api.com https://avatars.steamstatic.com https://avatars.akamai.steamstatic.com;
  connect-src https://api.deadlock-api.com https://generativelanguage.googleapis.com http://127.0.0.1:47615;
  worker-src 'self';
  manifest-src 'self';
  base-uri 'none';
  form-action 'none';
  object-src 'none'">

<title>Climb · Deadlock tracker</title>
<meta name="description" content="A simple Deadlock tracker: are you improving, which games you carried, and how each of your heroes compares with every rank from Initiate to Eternus.">
<meta name="theme-color" content="#0e0e10">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Climb">
<link rel="stylesheet" href="style.css?v=24">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/overview">Climb</a>
    <nav id="nav" class="nav" aria-label="Sections">
      <a href="#/overview" data-tab="overview">Overview</a>
      <a href="#/coach" data-tab="coach">Coach</a>
      <a href="#/matches" data-tab="matches">Matches</a>
      <a href="#/heroes" data-tab="heroes">Heroes</a>
      <a href="#/friends" data-tab="friends">Friends</a>
    </nav>
    <div class="top-r">
      <span id="status" class="status" aria-live="polite"></span>
      <button id="refresh" class="icon-btn" type="button" aria-label="Refresh" title="Refresh">↻</button>
      <button id="who" class="who" type="button" title="Account & about"></button>
    </div>
  </div>
</header>
<main id="view" class="view"></main>
<script src="js/changelog.js?v=24"></script>
<script src="js/engine.js?v=24"></script>
<script src="js/store.js?v=24"></script>
<script src="js/api.js?v=24"></script>
<script src="js/play.js?v=24"></script>
<script src="js/charts.js?v=24"></script>
<script src="js/wpmodel.js?v=24"></script>
<script src="js/coach.js?v=24"></script>
<script src="js/views.js?v=24"></script>
<script src="js/app.js?v=24"></script>
</body>
</html>
